<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tabela de Calibragem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111417">
<style>
  :root{
    --bg:#111417; --panel:#1a1e23; --panel-2:#20252b; --line:#2c3238;
    --amber:#f5a623; --amber-dim:#5c4218; --amber-glow: 0 0 12px rgba(245,166,35,.55);
    --text:#e9e7e2; --text-dim:#8b939c; --text-faint:#5a626b; --danger:#e2574c;
    --mono:'Space Mono', ui-monospace, Menlo, Consolas, monospace; --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{min-height:100vh;padding:20px 14px 60px;}
  .wrap{max-width:640px;margin:0 auto;}
  header{padding:18px 4px 22px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;margin-bottom:8px;}
  h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em;}
  .sub{font-size:13px;color:var(--text-dim);}
  .model-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px;}
  .model-row label{font-size:12px;color:var(--text-dim);flex:0 0 auto;}
  select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:13px;flex:1;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;}
  .tab{flex:1;text-align:center;padding:10px 8px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;user-select:none;transition:.15s;}
  .tab.active{background:var(--amber-dim);color:var(--amber);}
  .panel{display:none;} .panel.active{display:block;}
  .k-input-row{display:flex;gap:8px;margin-bottom:16px;}
  input[type=text]{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--text);font-family:var(--mono);font-size:20px;letter-spacing:.03em;}
  input[type=text]:focus{outline:none;border-color:var(--amber);box-shadow:var(--amber-glow);}
  input::placeholder{color:var(--text-faint);}
  .result-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-height:120px;}
  .result-empty{color:var(--text-faint);font-size:13px;text-align:center;padding:30px 10px;}
  .result-range{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-bottom:14px;}
  .result-range b{color:var(--amber);}
  .switch-panel{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 0 4px;}
  .sw{width:48px;}
  .sw-track{position:relative;width:48px;height:78px;background:#0c0e10;border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 2px 4px rgba(0,0,0,.5);}
  .sw-lamp{width:100%;height:22px;border-radius:5px;background:#2a2e33;transition:.2s;}
  .sw-lamp.on{background:var(--amber);box-shadow:var(--amber-glow);}
  .sw-num{text-align:center;font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:6px;}
  .sw.is-on .sw-num{color:var(--amber);font-weight:700;}
  .toggle-grid{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
  .toggle{width:52px;height:64px;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;user-select:none;transition:.12s;font-family:var(--mono);}
  .toggle .dot{width:16px;height:16px;border-radius:50%;background:#2a2e33;border:1px solid var(--line);}
  .toggle.on{background:var(--amber-dim);border-color:var(--amber);}
  .toggle.on .dot{background:var(--amber);box-shadow:var(--amber-glow);}
  .toggle .n{font-size:13px;color:var(--text-dim);}
  .toggle.on .n{color:var(--amber);font-weight:700;}
  .hint{font-size:12px;color:var(--text-faint);text-align:center;margin:-6px 0 16px;}
  .clear-btn{display:block;margin:0 auto 16px;background:transparent;border:1px solid var(--line);color:var(--text-dim);font-size:12px;padding:7px 14px;border-radius:20px;cursor:pointer;font-family:var(--sans);}
  .clear-btn:active{background:var(--panel-2);}
  .k-result{text-align:center;padding:22px 10px;}
  .k-result .big{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--amber);letter-spacing:.02em;}
  .k-result .label{font-size:12px;color:var(--text-dim);margin-top:6px;}
  .no-match{color:var(--danger);font-size:13px;text-align:center;padding:22px 10px;}
  .meta{font-size:11px;color:var(--text-faint);text-align:center;margin-top:10px;}
  footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-faint);line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Sistema ligado ao banco de dados</div>
    <h1>Tabela de Calibragem</h1>
    <div class="sub">Busca bidirecional: K ↔ interruptores</div>
  </header>

  <div class="model-row">
    <label>Modelo</label>
    <select id="modelSelect"><option>carregando…</option></select>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="k">Buscar por K</div>
    <div class="tab" data-tab="sw">Buscar por interruptores</div>
  </div>

  <div class="panel active" id="panel-k">
    <div class="k-input-row">
      <input type="text" id="kInput" placeholder="Digite o K, ex: 2437" inputmode="numeric">
    </div>
    <div class="result-card" id="kResult">
      <div class="result-empty">Digite um valor de K para ver os interruptores</div>
    </div>
  </div>

  <div class="panel" id="panel-sw">
    <div class="hint">Toque nos interruptores que estão ON no tacógrafo</div>
    <div class="toggle-grid" id="toggleGrid"></div>
    <button class="clear-btn" id="clearToggles">limpar seleção</button>
    <div class="result-card" id="swResult">
      <div class="result-empty">Selecione os interruptores ON para encontrar o K</div>
    </div>
  </div>

  <footer id="footerMeta"></footer>
</div>

<script>
const API = 'https://controle-k.vercel.app/api';
let modelos = [];
let currentModelo = null;
let selectedOn = new Set();
const TOTAL_SW = 10;

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-'+t.dataset.tab).classList.add('active');
  });
});

function renderSwitchPanel(onList){
  const onSet = new Set(onList);
  let html = '';
  for(let i=1;i<=TOTAL_SW;i++){
    const isOn = onSet.has(i);
    html += `<div class="sw ${isOn?'is-on':''}">
      <div class="sw-track"><div class="sw-lamp ${isOn?'on':''}"></div></div>
      <div class="sw-num">${i}</div>
    </div>`;
  }
  return html;
}

async function loadModelos(){
  const res = await fetch(`${API}/modelos`);
  modelos = await res.json();
  const sel = document.getElementById('modelSelect');
  sel.innerHTML = modelos.map(m =>
    `<option value="${m.id}">${m.nome} — K ${m.k_min ?? '?'}–${m.k_max ?? '?'} (${m.total_faixas} faixas)</option>`
  ).join('');
  currentModelo = modelos[0]?.id || null;
  document.getElementById('footerMeta').innerHTML =
    `<b>${modelos.length}</b> modelo(s) cadastrado(s) no banco.`;
}

document.getElementById('modelSelect').addEventListener('change', (e)=>{
  currentModelo = parseInt(e.target.value, 10);
  resetResults();
});

function resetResults(){
  document.getElementById('kInput').value = '';
  selectedOn.clear();
  document.querySelectorAll('.toggle').forEach(t=>t.classList.remove('on'));
  document.getElementById('kResult').innerHTML = '<div class="result-empty">Digite um valor de K para ver os interruptores</div>';
  document.getElementById('swResult').innerHTML = '<div class="result-empty">Selecione os interruptores ON para encontrar o K</div>';
}

const kInput = document.getElementById('kInput');
const kResult = document.getElementById('kResult');
let kDebounce;
kInput.addEventListener('input', ()=>{
  clearTimeout(kDebounce);
  const val = kInput.value.trim();
  if(!val){ kResult.innerHTML = '<div class="result-empty">Digite um valor de K para ver os interruptores</div>'; return; }
  kDebounce = setTimeout(async ()=>{
    if(!currentModelo) return;
    const res = await fetch(`${API}/buscar/k?modelo=${currentModelo}&k=${encodeURIComponent(val)}`);
    if(res.status === 404){
      kResult.innerHTML = '<div class="no-match">K fora da faixa cadastrada para esse modelo ainda.</div>';
      return;
    }
    const data = await res.json();
    kResult.innerHTML = `
      <div class="result-range">Faixa: <b>${data.k_inicio}</b> ... <b>${data.k_fim}</b></div>
      <div class="switch-panel">${renderSwitchPanel(data.interruptores_on)}</div>`;
  }, 200);
});

const toggleGrid = document.getElementById('toggleGrid');
const swResult = document.getElementById('swResult');
for(let i=1;i<=TOTAL_SW;i++){
  const el = document.createElement('div');
  el.className = 'toggle';
  el.innerHTML = `<div class="dot"></div><div class="n">${i}</div>`;
  el.addEventListener('click', ()=>{
    if(selectedOn.has(i)){ selectedOn.delete(i); el.classList.remove('on'); }
    else { selectedOn.add(i); el.classList.add('on'); }
    runSwitchSearch();
  });
  toggleGrid.appendChild(el);
}
document.getElementById('clearToggles').addEventListener('click', ()=>{
  selectedOn.clear();
  document.querySelectorAll('.toggle').forEach(t=>t.classList.remove('on'));
  runSwitchSearch();
});

async function runSwitchSearch(){
  if(selectedOn.size===0 || !currentModelo){
    swResult.innerHTML = '<div class="result-empty">Selecione os interruptores ON para encontrar o K</div>';
    return;
  }
  const on = [...selectedOn].sort((a,b)=>a-b).join(',');
  const res = await fetch(`${API}/buscar/interruptores?modelo=${currentModelo}&on=${on}`);
  if(res.status === 404){
    swResult.innerHTML = '<div class="no-match">Combinação não encontrada para esse modelo ainda.</div>';
    return;
  }
  const data = await res.json();
  swResult.innerHTML = `
    <div class="k-result">
      <div class="big">${data.k_inicio===data.k_fim ? data.k_inicio : data.k_inicio+'–'+data.k_fim}</div>
      <div class="label">valor de K correspondente</div>
    </div>`;
}

loadModelos();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js');
  });
}
</script>
</body>
</html>
